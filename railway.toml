[build]
builder = "NIXPACKS"

[deploy]
# See backend/start_railway.sh. The previous inline form discarded training
# stderr and continued through a bare `;`, so a failed build of the model
# artifact was silent and indistinguishable from success.
startCommand = "bash backend/start_railway.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
